[project]
name = "ai-lab-pyspark-sales-aggregation"
version = "0.1.2"
description = "Learn PySpark by aggregating synthetic sales records: totals, averages, ranks and running values, saved as Parquet (series part 1/5)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.3.0,<5",
]

[project.scripts]
sales-agg = "sales_agg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
