# Runs the whole test suite against a real local Spark session (no API keys involved).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday - catches dependency or runtime drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
